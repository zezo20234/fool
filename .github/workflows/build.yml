name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies & Pods
        run: |
          cd Studytime
          if [ -f "Podfile" ]; then
            pod install
          fi

      - name: Build Xcode Archive
        run: |
          cd Studytime
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
            SCHEME=$(basename "$WORKSPACE" .xcworkspace)
            xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -archivePath ../build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          else
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            SCHEME=$(basename "$PROJECT" .xcodeproj)
            xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -archivePath ../build/App.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r StudyTime.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTime-IPA
          path: StudyTime.ipa
