name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pods if available
        run: |
          PODFILE_PATH=$(find . -name "Podfile" | head -n 1)
          if [ -n "$PODFILE_PATH" ]; then
            POD_DIR=$(dirname "$PODFILE_PATH")
            echo "Found Podfile in $POD_DIR"
            cd "$POD_DIR"
            pod install
            cd -
          fi

      - name: Build Xcode Archive
        run: |
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -n 1)
          
          if [ -n "$WORKSPACE" ]; then
            echo "Using Workspace: $WORKSPACE with Scheme: Studytime"
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "Studytime" \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            PROJECT=$(find . -name "*.xcodeproj" -not -path "*/Pods/*" | head -n 1)
            echo "Using Project: $PROJECT with Scheme: Studytime"
            xcodebuild archive \
              -project "$PROJECT" \
              -scheme "Studytime" \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: Create Unsigned IPA Package
        run: |
          mkdir -p Payload
          APP_PATH=$(find . -name "*.app" -not -path "*/Pods/*" | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r StudyTime.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTime-IPA
          path: StudyTime.ipa
